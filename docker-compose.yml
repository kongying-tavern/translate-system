# 项目名跟随 COMPOSE_PROJECT_NAME（.env），未设置时回退 translate-system；容器名同源
name: ${COMPOSE_PROJECT_NAME:-translate-system}

services:
  postgres:
    container_name: ${COMPOSE_PROJECT_NAME:-translate-system}-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-20432}:5432"
    volumes:
      - ${DATA_ROOT:-./data}/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: ${COMPOSE_PROJECT_NAME:-translate-system}-backend
    restart: always
    build:
      context: ./backend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
    ports:
      - "${BACKEND_PORT:-20080}:8080"
    environment:
      # OpenAPI 文档开关（根 .env 配置，默认 false）
      OPENAPI_SWAGGER: ${OPENAPI_SWAGGER:-false}
      OPENAPI_API_JSON: ${OPENAPI_API_JSON:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-604800}
      PORT: "8080"
      # 大文件导入（200MB 级）解析会占用数 GB 堆内存，V8 默认堆上限（~2GB）不够。
      # 只从外部读数字 NODE_MEMORY_MB，拼接到固定参数 --max-old-space-size，不直接透传 NODE_OPTIONS 防注入
      NODE_OPTIONS: "--max-old-space-size=${NODE_MEMORY_MB:-4096}"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "sh ./startup.sh"

  frontend:
    container_name: ${COMPOSE_PROJECT_NAME:-translate-system}-frontend
    restart: always
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        VITE_APP_NAME: ${VITE_APP_NAME:-翻译管理平台}
    ports:
      - "${FRONTEND_PORT:-20010}:80"
    depends_on:
      - backend
